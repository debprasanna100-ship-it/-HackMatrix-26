# TrustLens Alembic configuration.
#
# The database URL is NOT stored here: env.py resolves it from (in order)
#   1. the TRUSTLENS_DATABASE_URL environment variable,
#   2. the sqlalchemy.url set programmatically on this Config object,
#   3. app.config Settings (backend/.env / defaults).
#
# Runtime policy (app/storage/database.py): PostgreSQL deployments run
# `alembic upgrade head` at startup; SQLite (local dev/tests) keeps the
# automatic create_all + in-place column fallback and does NOT run Alembic.

[alembic]
script_location = alembic
# Explicit split rule for prepend_sys_path (Alembic >= 1.13 deprecates the
# implicit space/comma/colon splitting and warned on every upgrade otherwise).
path_separator = os
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
